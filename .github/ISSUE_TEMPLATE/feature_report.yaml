# Docs - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Feature suggestion
description: Suggest a new feature for this fork
title: "Enter a title for the suggestion here"
labels: feature request
body:
  - type: markdown
    id: md_readme
    attributes:
      value: |
        ## Important: Read First

        This fork exists to add **custom texture loading** to Cemu, mainly for Monster Hunter 3
        Ultimate. Suggestions that fit that scope are very welcome — extra texture formats,
        better handling of a particular case, quality-of-life around building texture packs,
        and so on.

        Please **don't** suggest here:

        - **General Cemu features** unrelated to texture loading (performance, input, other
          backends, other platforms). Those belong with the
          [Cemu project](https://github.com/cemu-project/Cemu/issues) — this fork tracks
          upstream and doesn't reimplement it.
        - **Support for a specific texture pack.** This fork loads whatever textures you give
          it; it isn't tied to any particular pack and won't be.

        It's a one-person project done in spare time, so useful ideas may still sit a while.
        That isn't disinterest.
  - type: textarea
    id: idea_suggestion
    attributes:
      label: Your suggestion
      description: "Describe what your suggestion is in as much detail as possible"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: What would you use it for? (Optional)
      description: "Knowing the actual problem you're trying to solve often leads to a better solution than the one suggested."
    validations:
      required: false
